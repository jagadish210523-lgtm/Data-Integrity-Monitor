services:
  - type: web
    name: data-integrity-monitor
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        sync: false
      - key: REFRESH_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
  - type: web
    name: data-integrity-monitor-frontend
    runtime: static
    buildCommand: echo "Serving static frontend"
    staticPublishPath: ./frontend